data:
  raw_dir: 'data/raw'
  processed_dir: 'data/processed'
  splits_dir: 'data/splits'
  dataset: 'isot'
  test_size: 0.15
  val_size: 0.15
  random_state: 42

features:
  extract_basic: true
  extract_linguistic: true
  extract_clickbait: true
  normalize: true

model:
  type: 'ensemble'
  transformer:
    model_name: 'distilbert-base-uncased'
    max_length: 512
    batch_size: 32
    learning_rate: 0.00002
    epochs: 3
  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 5
  random_forest:
    n_estimators: 100
    max_depth: 15

training:
  batch_size: 32
  epochs: 10
  early_stopping: true

api:
  host: '0.0.0.0'
  port: 5000
  debug: false
  workers: 4

database:
  host: 'localhost'
  port: 5432
  name: 'fake_news_detector'
  user: 'detector'
  password: 'detector_pass_123'

logging:
  level: 'INFO'
  file: 'logs/app.log'
