version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fake-news-db
    environment:
      POSTGRES_DB: fake_news_detector
      POSTGRES_USER: detector
      POSTGRES_PASSWORD: detector_pass_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U detector']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fake-news-cache
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: fake-news-api
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://detector:detector_pass_123@postgres:5432/fake_news_detector
      REDIS_URL: redis://redis:6379/0
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: fake-news-prometheus
    ports:
      - '9090:9090'
    volumes:
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: fake-news-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - '3001:3000'
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
